services:
  - type: web
    name: treno-web
    env: python
    buildCommand: docker build -t treno-backend ./backend
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
    plan: free
    region: singapore
    branch: main
    rootDir: backend
